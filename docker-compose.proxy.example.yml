# Optionales Override für Container-Reverse-Proxys (Nginx Proxy Manager, Traefik, ...):
# hängt n8n und Panel zusätzlich in das Docker-Netz des Proxys, sodass er sie über
# die Container-Namen erreicht (n8n:5678, panel:3002).
#
# Nutzung:
#   1. Datei kopieren:  cp docker-compose.proxy.example.yml docker-compose.proxy.yml
#   2. PROXY_NETWORK in der .env auf das Netz des Proxys setzen (docker network ls)
#   3. Starten mit:     docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d
#
# Wer die Dienste ausschließlich über den Proxy erreichbar machen will, kann in der
# Kopie zusätzlich die ports-Einträge von n8n/panel auf "127.0.0.1:5678:5678" bzw.
# "127.0.0.1:3002:3002" einschränken oder ganz entfernen.

services:
  n8n:
    networks:
      - internal
      - proxy
  panel:
    networks:
      - internal
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
