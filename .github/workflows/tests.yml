name: Tests

# Der Testlauf hält fest, was schon einmal schiefgegangen ist: Absender-
# Fälschungen, doppelte Sortier-Inbox-Einträge, Mails, die als verschoben
# gemeldet wurden ohne es zu sein, und Archive, die sich nicht mehr öffnen
# lassen. Läuft er nicht durch, soll gar kein Image entstehen.
# Auf master läuft der Testlauf NICHT hier, sondern als vorgeschaltete Stufe in
# docker-build.yml — dort verhindert er im Fehlerfall den Image-Bau. Hier bleibt
# er für Pull Requests und für den Aufruf von Hand, wo kein Abbild entsteht.
on:
  # Auf master nur für die Dateien, die kein Image erzeugen, aber trotzdem
  # geprüft gehören: konfiguration.test.js vergleicht .env.example mit der
  # docker-compose.yml und würde sonst nie anschlagen, wenn jemand nur eine
  # von beiden ändert.
  push:
    branches: [master]
    paths:
      - 'docker-compose.yml'
      - '.env.example'
      - 'einrichten.sh'
      - 'LICENSE'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'panel/backend/**'
      - 'docker-compose.yml'
      - '.env.example'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Der Testlauf liest nur — mehr braucht er nicht. Ohne diesen Block bekäme
    # der Token die Standardrechte des Repositories, also je nach Einstellung
    # auch Schreibrechte.
    permissions:
      contents: read
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          # Dieselbe Hauptversion wie im Image (siehe panel/Dockerfile), sonst
          # prüft die CI etwas anderes als das, was später läuft.
          node-version: '22'

      - name: Abhängigkeiten installieren
        working-directory: panel/backend
        # better-sqlite3 ist ein natives Modul und wird hier übersetzt.
        run: npm install --no-audit --no-fund

      - name: Tests
        working-directory: panel/backend
        run: npm test

      # Bekannte Schwachstellen in den Abhängigkeiten sichtbar machen. Bewusst
      # nicht blockierend: Eine neue Meldung in einem fremden Paket soll keinen
      # Testlauf rot färben, der mit der eigenen Änderung nichts zu tun hat —
      # sie soll im Protokoll stehen, damit sie jemand liest.
      - name: Schwachstellen-Check (Backend)
        working-directory: panel/backend
        continue-on-error: true
        run: npm audit --omit=dev

      - name: Schwachstellen-Check (Frontend)
        working-directory: panel/frontend
        continue-on-error: true
        run: npm install --no-audit --no-fund && npm audit --omit=dev
