# Mail-Panel — kompletter Stack in einer Datei.
#
# Installation:  docker compose up -d
#
# Mehr ist nicht nötig. Alle Schlüssel und Passwörter werden beim ersten Start
# automatisch erzeugt und in den Volumes gespeichert; Zugangsdaten zu n8n,
# Mailcow & Co. trägst du später bequem im Panel ein.
#
#   Panel: http://<server>:3002      n8n: http://<server>:5678
#
# Für HTTPS einen beliebigen Reverse Proxy (Nginx Proxy Manager, Traefik, Caddy, ...)
# auf diese beiden Ports zeigen lassen — bei n8n Websocket-Unterstützung aktivieren.
# Optionale Anpassungen (Ports, Zeitzone, Domain) siehe .env.example.

services:
  # ─── Datenbank für n8n ──────────────────────────────────────────────────────
  n8n-db:
    image: postgres:16-alpine
    container_name: n8n-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_DB=n8n
      # Nur intern erreichbar (kein veröffentlichter Port), daher genügt ein
      # fester Wert. Wer mag, setzt DB_PASSWORD in der .env auf etwas Eigenes.
      - POSTGRES_PASSWORD=${DB_PASSWORD:-n8n-intern}
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ─── Community-Node vorinstallieren ─────────────────────────────────────────
  # n8n braucht das Paket n8n-nodes-imap zum Verschieben und Suchen per IMAP.
  # Dieser Einmal-Container legt es ins n8n-Volume, bevor n8n startet — so muss
  # man es nicht von Hand über die Oberfläche nachinstallieren.
  n8n-nodes-init:
    image: node:24-alpine
    container_name: n8n-nodes-init
    working_dir: /nodes
    volumes:
      - n8n_data:/home/node/.n8n
    command:
      - sh
      - -c
      - |
        mkdir -p /home/node/.n8n/nodes && cd /home/node/.n8n/nodes
        [ -f package.json ] || echo '{"name":"installed-nodes","private":true}' > package.json
        if ! npm list n8n-nodes-imap >/dev/null 2>&1; then
          npm install n8n-nodes-imap --omit=dev --no-audit --no-fund
        fi
        chown -R 1000:1000 /home/node/.n8n
    restart: "no"
    networks:
      - internal

  # ─── n8n: Workflow-Engine ───────────────────────────────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    depends_on:
      n8n-db:
        condition: service_healthy
      n8n-nodes-init:
        condition: service_completed_successfully
    environment:
      # Erreichbarkeit: hinter einem Reverse Proxy N8N_PUBLIC_URL in der .env setzen,
      # sonst genügt die Server-Adresse mit Port.
      - N8N_EDITOR_BASE_URL=${N8N_PUBLIC_URL:-}
      - WEBHOOK_URL=${N8N_PUBLIC_URL:-}
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=${TZ:-Europe/Berlin}
      - TZ=${TZ:-Europe/Berlin}
      # Datenbank
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD:-n8n-intern}
      # n8n erzeugt seinen Verschlüsselungsschlüssel beim ersten Start selbst und
      # legt ihn im Volume ab — dieses Volume also nicht löschen, sonst sind die
      # gespeicherten Zugangsdaten unbrauchbar.
      - N8N_RUNNERS_ENABLED=true
      - N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    networks:
      - internal

  # ─── Mail-Panel: Verwaltungsoberfläche + Prüfdienste ────────────────────────
  panel:
    image: ghcr.io/roobiing/mail-panel:latest
    # Ist das fertige Image nicht verfügbar, baut Compose es aus dem Ordner panel/.
    build:
      context: .
      dockerfile: panel/Dockerfile
    container_name: mail-panel
    restart: unless-stopped
    environment:
      # Schlüssel werden beim ersten Start automatisch erzeugt und im Volume
      # abgelegt. Nur setzen, wer sie selbst vorgeben will (siehe .env.example).
      - JWT_SECRET=${JWT_SECRET:-}
      - PANEL_SECRET=${PANEL_SECRET:-}
      - PANEL_DB_KEY=${PANEL_DB_KEY:-}
      # Zugangsdaten für n8n, Mailcow und Safe Browsing trägst du im Panel unter
      # Einstellungen ein — dafür sind hier keine Variablen nötig.
      - N8N_URL=http://n8n:5678
      # Fest verdrahtet waeren diese beiden ein stiller Widerspruch zu
      # einrichten.sh: Das Skript traegt einen vorhandenen Dienst in die .env
      # ein, und compose ueberschriebe ihn hier sofort wieder.
      - CLAMD_HOST=${CLAMD_HOST:-clamav}
      - UNBOUND_HOST=${UNBOUND_HOST:-unbound}
      - TZ=${TZ:-Europe/Berlin}
      # HTTPS auf dem eigenen Port — Erklaerung in .env.example
      - TLS_MODUS=${TLS_MODUS:-}
      - TLS_CERT=${TLS_CERT:-}
      - TLS_KEY=${TLS_KEY:-}
      - PANEL_HOST=${PANEL_HOST:-}
      # Aufsicht ueber die Workflows — Erklaerung in .env.example
      - AUFSICHT_AKTIV=${AUFSICHT_AKTIV:-}
      - AUFSICHT_REPARIEREN=${AUFSICHT_REPARIEREN:-}
      - AUFSICHT_TAKT=${AUFSICHT_TAKT:-}
    volumes:
      - panel_data:/app/data
    ports:
      - "${PANEL_PORT:-3002}:3002"
    depends_on:
      - n8n
    networks:
      - internal

  # ─── ClamAV: Virenscan für Mail-Anhänge (nur intern) ────────────────────────
  # Braucht ~1,5 GB RAM. Die Signaturen liegen im Volume und werden vom
  # Container selbst aktuell gehalten.
  #
  # Steht hinter einem Profil, weil viele Server ClamAV schon haben — Mailcow
  # zum Beispiel liefert es mit. Ein zweites daneben zu starten kostet den
  # Speicher zweimal, ohne etwas zu können, was das erste nicht könnte.
  # `./einrichten.sh` sieht nach, was vorhanden ist, und trägt entweder das
  # Profil oder CLAMD_HOST in die .env ein. Danach genügt `docker compose up -d`.
  clamav:
    image: clamav/clamav:latest
    container_name: clamav
    restart: unless-stopped
    profiles: ["clamav"]
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      - internal

  # ─── unbound: DNS-Resolver für die DNSBL-Abfragen (nur intern) ──────────────
  # Nötig, weil Spamhaus & Co. Anfragen über öffentliche Resolver blockieren.
  # Dasselbe Profil-Verfahren wie bei ClamAV, aus demselben Grund.
  unbound:
    image: mvance/unbound:latest
    container_name: unbound
    restart: unless-stopped
    profiles: ["unbound"]
    networks:
      - internal

networks:
  internal:

volumes:
  n8n_data:
  n8n_db_data:
  panel_data:
  clamav_db:
