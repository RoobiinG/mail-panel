# Mail-Panel-Stack: n8n + PostgreSQL + Panel + ClamAV + unbound
#
# Läuft auf jedem Server mit Docker: `docker compose up -d` genügt, die Dienste
# sind danach über die veröffentlichten Ports erreichbar (n8n: 5678, Panel: 3002).
# Für HTTPS einen beliebigen Reverse Proxy davorschalten (Nginx Proxy Manager,
# Traefik, Caddy, ...). Läuft der Proxy selbst als Container, siehe
# docker-compose.proxy.example.yml — dann können die Ports entfallen.
# n8n hinter dem Proxy braucht Websocket-Unterstützung!

services:
  n8n-db:
    image: postgres:16-alpine
    container_name: n8n-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    depends_on:
      n8n-db:
        condition: service_healthy
    environment:
      # Erreichbarkeit hinter dem Reverse Proxy
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://${N8N_HOST}/
      - N8N_PROXY_HOPS=1
      # Credentials-Verschlüsselung — Key NIEMALS ändern, sonst sind alle
      # gespeicherten Zugangsdaten unbrauchbar
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # Zeitzone (wichtig für Schedule-Trigger)
      - GENERIC_TIMEZONE=${TZ:-Europe/Berlin}
      - TZ=${TZ:-Europe/Berlin}
      # Datenbank
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${DB_NAME}
      - DB_POSTGRESDB_USER=${DB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD}
      # Empfohlen von n8n (Task Runner für Code-Nodes)
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - internal
    ports:
      - "5678:5678"

  # ─── Mail-Panel: Verwaltungsoberfläche + Prüfdienste-Backend ───────────────
  panel:
    image: ghcr.io/roobiing/mail-panel:latest
    # Zum lokalen Bauen statt Registry-Image:
    # build: ./panel
    container_name: mail-panel
    restart: unless-stopped
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - PANEL_SECRET=${PANEL_SECRET}
      - PANEL_DB_KEY=${PANEL_DB_KEY}
      - N8N_URL=http://n8n:5678
      - N8N_API_KEY=${N8N_API_KEY}
      - MAILCOW_URL=${MAILCOW_URL}
      - MAILCOW_API_KEY=${MAILCOW_API_KEY}
      - SAFEBROWSING_API_KEY=${SAFEBROWSING_API_KEY}
      - CLAMD_HOST=clamav
      - UNBOUND_HOST=unbound
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - panel_data:/app/data
    networks:
      - internal
    ports:
      - "3002:3002"
    depends_on:
      - n8n

  # ─── ClamAV: Virenscan für Mail-Anhänge (clamd, TCP 3310, nur intern) ──────
  # Braucht ~1,5 GB RAM; die Signaturen landen im Volume und werden von
  # freshclam im Container automatisch aktuell gehalten.
  clamav:
    image: clamav/clamav:latest
    container_name: clamav
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      - internal

  # ─── unbound: eigener DNS-Resolver für DNSBL-Abfragen (nur intern) ─────────
  # Nötig, weil Spamhaus & Co. Abfragen über öffentliche Resolver blocken.
  unbound:
    image: mvance/unbound:latest
    container_name: unbound
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:

volumes:
  n8n_data:
  n8n_db_data:
  panel_data:
  clamav_db:
